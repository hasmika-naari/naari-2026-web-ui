<div
    class="sidebar-area bg-white transition"
    [ngClass]="{'active': isToggled}"
>
    <div class="logo" [class.collapsed]="isToggled">
        <a routerLink="/" class="logo-link" aria-label="Naari Deals home">
            <div class="logo-mark">
                <img src="assets/img/logo.png" alt="Naari Deals logo">
            </div>
            <div class="brand-text" aria-hidden="false">
                <span class="brand-line primary">Naari</span>
                <span class="brand-line accent">Deals</span>
            </div>
        </a>
        <button
            *ngIf="isToggled"
            type="button"
            class="sidebar-handle expand transition"
            (click)="toggle()"
            aria-label="Expand sidebar"
            title="Expand sidebar"
        >
            <svg class="split-pill mirrored" viewBox="0 0 12 16" role="presentation" aria-hidden="true">
                <rect class="pill-fill" x="3.9" y="1.4" width="7.4" height="13.2" rx="1" ry="1"></rect>
                <rect x="0.75" y="0.75" width="10.5" height="14.5" rx="1.6" ry="1.6" fill="none" stroke="currentColor" stroke-width="1"></rect>
                <line x1="4" y1="1.8" x2="4" y2="14.2" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-dasharray="1 1.4"></line>
            </svg>
        </button>
        <button
            *ngIf="!isToggled"
            type="button"
            class="sidebar-handle collapse transition"
            (click)="toggle()"
            aria-label="Collapse sidebar"
            title="Collapse sidebar"
        >
            <svg class="split-pill" viewBox="0 0 12 16" role="presentation" aria-hidden="true">
                <rect class="pill-fill" x="1.2" y="1.4" width="3.2" height="13.2" rx="1" ry="1"></rect>
                <rect x="0.75" y="0.75" width="10.5" height="14.5" rx="1.6" ry="1.6" fill="none" stroke="currentColor" stroke-width="1"></rect>
                <line x1="4" y1="1.8" x2="4" y2="14.2" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-dasharray="1 1.4"></line>
            </svg>
        </button>
    </div>
    <div class="sidebar-inner">
        <div class="sidebar-menu">
            <ul class="sidebar-flat-menu">
                <li *ngFor="let item of menuItems">
                    <a
                        class="sidebar-menu-link flat"
                        [routerLink]="item.route"
                        routerLinkActive="active"
                        [routerLinkActiveOptions]="{exact: true}"
                    >
                        <span
                            class="menu-icon"
                            [attr.title]="isToggled ? item.label : null"
                            [attr.aria-label]="isToggled ? item.label : null"
                        >
                            <i-feather [name]="item.icon"></i-feather>
                        </span>
                        <div class="menu-text">
                            <span class="title">{{ item.label }}</span>
                        </div>
                    </a>
                </li>
            </ul>
        </div>
    </div>
</div>
