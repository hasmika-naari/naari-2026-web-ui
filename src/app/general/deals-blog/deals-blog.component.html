<div
    class="blog-slides"
    [class.dark-blog-slides]="themeService.isDark()"
>
    <owl-carousel-o *ngIf="browser && deals && deals.length" [options]="blogSlides" >
        <ng-template carouselSlide *ngFor="let deal of deals;">
            <div class="single-blog-post mb-30">
                <div class="post-image">
                    <a  [routerLink]="['/deal', deal.id]" style="height: 200px ;display: flex;" class="image-link "
                        >
                            <img  [src]="deal.imageUrl" width="200" height="500"  style="max-height:500px;
                            margin: auto; width:auto;height:auto;
                            display: block;" alt="">
                        
                        </a>
                    <div class="tag">
                        <a *ngIf="deal.discountType === '%'" routerLink="/">{{deal.discount}}% OFF</a>
                        <a *ngIf="deal.discountType !== '%'" routerLink="/">{{deal.discountType}} {{deal.discount}} OFF</a>
                    </div>
                </div>
                <div class="post-content">
                    <ul class="post-meta">
                        <li class="post-author prices">
                            <i *ngIf="(+deal.discount > 0)" class="bx bxs-hot hotjar-app-icon"></i>
                           <a href="" class="d-inline-block new-price">
                                <span style="font-size:medium;position: relative;right: -3px;" *ngIf="country === 'usa'">$</span>
                                <span style="font-size:medium;position: relative;right: -3px;" *ngIf="country !== 'usa'">₹</span>
                                {{deal.currentPrice | number : '1.2-2'}}
                           </a>
                        </li>
                        <li>
                            <a href="" class="old-price">
                                <span style="font-size:small;position: relative;right: -3px;" *ngIf="country === 'usa'">$</span>
                                <span style="font-size:small;position: relative;right: -3px;" *ngIf="country !== 'usa'">₹</span>
                                {{deal.originalPrice | number : '1.2-2'}}
                            </a>
                        </li>
                    </ul>
                    <div class="deal-box-footer">
                        <h3><a [routerLink]="['/deal', deal.id]" class="d-inline-block related-deal-title">{{deal.title}}</a></h3>
                        <a [routerLink]="['/deal', deal.id]" class="read-more-btn ">Grab <i class='bx bx-right-arrow-alt'></i></a>
                        <a href="" (click)="shareOnWhatsApp($event, deal)" class="read-more-btn ml--30">Share <i class='bx bx-share-alt'></i></a>
                    </div>
                  
                </div>
            </div>
        </ng-template>
    </owl-carousel-o>


</div>
