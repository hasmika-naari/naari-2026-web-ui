<div class="deal-type-list-slide naari-container-padding" >
    <owl-carousel-o [options]="categoryTypesSlideConfig" class="new-course-slider owl-theme">
        <ng-template carouselSlide *ngFor="let dealType of filteredDealTypes;let i=index;" >
            <div  class="gct-features-list-item-box mb-30  wow fadeInUp"  data-wow-offset="10" data-wow-duration="1s"
                [attr.data-wow-delay]="(+i*200).toString() + 'ms'" (click)="gotoDeals($event, dealType)"
                (mouseover)="hover=true" (mouseleave)="hover=false"
                [style.backgroundColor]="dealType.bgColor  + 'a0'">
                <div class="icon  wow fadeInUp"  data-wow-offset="10" data-wow-duration="2.5s"
                        [ngStyle]="{borderColor: hover==true  ? dealType.bgColor : 'rgba(255, 255, 255, 0.1)' }">
                    <i [class]='dealType.icon' [class.show-opacity]="dealType.status !== 'active'"
                    [ngStyle]="{color: hover==true  ? dealType.bgColor : '#fff' }" ></i>
                </div>
                <h3 class=" pb-0 mb-0  wow fadeInUp"  [class.show-opacity]="dealType.status !== 'active'"
                    data-wow-offset="10" data-wow-duration="2.5s">{{dealType.title}}</h3>
                <small class="  wow fadeInUp" style="color:white;letter-spacing: 1px;" [class.show-opacity]="dealType.status !== 'active'"
                    data-wow-offset="10" data-wow-duration="2.5s">{{dealType.subTitle}}</small>
                <div class="dealtype-deal-number-div  wow fadeInUp" data-wow-offset="10" data-wow-duration="2.5s">
                    <i class="special-pick" [class]='dealType.icon'  style="font-size:large ;position: relative;left: 0px;top: 3px;"  *ngIf="dealType?.code === 'SPECIALPICK'" ></i>
                    <!-- <fa-icon  style="font-size: x-larg ;position: relative;left: 0px;top: 3px;"
                        *ngIf="dealType?.code !== 'SPECIALPICK'"  [icon]="faTags"></fa-icon>  -->
                    <span class="display-label">{{dealType?.dealCount }}</span>
                </div>
            </div>
        </ng-template>
    </owl-carousel-o>
</div>
