<footer class="footer-area">
    <!-- Main Footer Content -->
    <div class="footer-bottom-area">
        <div class="footer-content">
            <!-- Three Column Footer Layout: Left Categories | Center Logo | Right Categories -->
            <div class="footer-columns-wrapper" *ngIf="browser">
                <!-- Left Column - Categories -->
                <div class="chips-column chips-left">
                    <a *ngFor="let cat of leftChips()" 
                       class="chip"
                       [routerLink]="['/deals']" 
                       [queryParams]="{ type: 'All', category: cat.code }">
                        <i class='bx bx-purchase-tag'></i>
                        <span>{{cat.title}}</span>
                    </a>
                </div>

                <!-- Center Logo Section -->
                <div class="logo-section">
                    <div class="logo text-center">
                        <a routerLink="/" class="d-inline-block">
                            <img src="assets/img/logo.png" alt="Naari Deals">
                        </a>
                    </div>
                </div>

                <!-- Right Column - Categories -->
                <div class="chips-column chips-right">
                    <a *ngFor="let cat of rightChips()" 
                       class="chip"
                       [routerLink]="['/deals']" 
                       [queryParams]="{ type: 'All', category: cat.code }">
                        <i class='bx bx-purchase-tag'></i>
                        <span>{{cat.title}}</span>
                    </a>
                </div>
            </div>

            <!-- Footer Center Content -->
            <div class="footer-center-content">
                <p class="footer-tagline">
                    Naari Deals — Curated deals for the modern woman. Handpicked offers across fashion, beauty, home and more. New deals daily — shop smart, save more.
                </p>
                <ul class="social-icons" *ngIf="browser">
                    <li><a href="https://www.facebook.com/people/Naari-Deals/100088113458576" target="_blank" aria-label="Naari on Facebook"><i class='bx bxl-facebook'></i></a></li>
                    <li><a href="https://www.instagram.com/naarideals/" target="_blank" aria-label="Naari on Instagram"><i class='bx bxl-instagram'></i></a></li>
                </ul>
            </div>

            <!-- Footer Bottom: Copyright & Links -->
            <div class="footer-bottom">
                <div class="row">
                    <div class="col-12">
                        <p class="copyright-text">
                            <i class='bx bx-copyright'></i> 2025 <a routerLink="/">Naari Deals</a>
                            <span class="separator"> | </span>
                            <a routerLink="/privacy">Privacy</a>
                            <span class="separator"> | </span>
                            <a routerLink="/terms">Terms</a>
                            <span class="separator"> | </span>
                            <a routerLink="/contact-us">Contact Us</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</footer>

<ngx-scrolltop></ngx-scrolltop>
