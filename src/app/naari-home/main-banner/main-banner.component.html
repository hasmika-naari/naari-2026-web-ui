<div class="banner-section">
    <div id="mask" class="mask"></div> 
    <div class="d-table info-box" [class.info-box]="desktop" [class.info-box-mobile]="!desktop">
        <div class="d-table-cell">
            <div class="container " [class.container-position]="desktop" [class.container-position-mobile]="!desktop" >
                <div class="banner-content fade-in-down-feature" *ngIf="browser">
                    <span class="sub-title fade-in-up-text"  >Savings Hub</span>
                    <h1 class="fade-in-up-text sub-message"  >Chic deals for her, where style meets savings.</h1>
                </div>
                <div class="feature-div-position-2" style="min-height: 150px;" >
                    <app-feature-types *ngIf="browser && (desktop || tablet)"></app-feature-types>
                </div>
                <div   class="container" style="position: relative;top:10px;min-height:150px;" *ngIf="browser && (desktop || tablet)">
                    <app-category-types *ngIf="browser" [dealTypes]="dealTypes"></app-category-types>
                </div>
            </div>
             <!-- White SVG Wave at Bottom -->
 
        </div>
    </div>
    <svg class="bottom-wave" viewBox="0 0 1440 320" preserveAspectRatio="none">
        <path fill="rgb(245, 247, 250)" fill-opacity="1"
        d="M0,256L48,245.3C96,235,192,213,288,197.3C384,181,480,171,576,186.7C672,203,768,245,864,256C960,267,1056,245,1152,224C1248,203,1344,181,1392,170.7L1440,160L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z">
        </path>
    </svg>
</div>
