<div class="banner-section">
    <div id="mask" class="mask"></div> 
    <div class="d-table info-box" [class.info-box]="desktop" [class.info-box-mobile]="!desktop">
        <div class="d-table-cell">
            <div class="container " [class.container-position]="desktop" [class.container-position-mobile]="!desktop" >
                <div class="banner-content-wrapper animate__animated animate__fadeInUp animate__delay-1s" *ngIf="browser">
                    <div class="banner-content">
                        <span class="sub-title"><span class="sub-title-line"></span>Savings Hub</span>
                        <h1 class="sub-message">Chic deals for her, where style meets savings.</h1>
                    </div>
                    
                    <!-- Black Friday Countdown - Right Side -->
                    <div class="bf-countdown-small">
                        <div class="bf-label">⚡ Black Friday</div>
                        <div class="bf-timer">
                            <div class="bf-time-unit">
                                <span class="bf-value">{{ countdown.days }}</span>
                                <span class="bf-label-text">D</span>
                            </div>
                            <span class="bf-sep">:</span>
                            <div class="bf-time-unit">
                                <span class="bf-value">{{ countdown.hours }}</span>
                                <span class="bf-label-text">H</span>
                            </div>
                            <span class="bf-sep">:</span>
                            <div class="bf-time-unit">
                                <span class="bf-value">{{ countdown.minutes }}</span>
                                <span class="bf-label-text">M</span>
                            </div>
                            <span class="bf-sep">:</span>
                            <div class="bf-time-unit">
                                <span class="bf-value">{{ countdown.seconds }}</span>
                                <span class="bf-label-text">S</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="feature-div-position-2" style="min-height: 150px;" >
                    <app-feature-types *ngIf="browser && (desktop || tablet)"></app-feature-types>
                </div>
                <div   class="container" style="position: relative;top:10px;min-height:150px;" *ngIf="browser && (desktop || tablet)">
                    <app-category-types *ngIf="browser" [dealTypes]="dealTypes"></app-category-types>
                </div>
            </div>
             <!-- White SVG Wave at Bottom -->
 
        </div>
    </div>
    <svg class="bottom-wave" viewBox="0 0 1440 320" preserveAspectRatio="none" style="display: block; margin: 0; padding: 0; border: none;">
        <defs>
            <linearGradient id="waveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:#F5E6D3;stop-opacity:0.3" />
                <stop offset="50%" style="stop-color:#FFE8E0;stop-opacity:0.2" />
                <stop offset="100%" style="stop-color:#F8E4DC;stop-opacity:0.3" />
            </linearGradient>
        </defs>
        <path fill="url(#waveGradient)"
        d="M0,224L48,213.3C96,203,192,181,288,181.3C384,181,480,203,576,213.3C672,224,768,224,864,213.3C960,203,1056,181,1152,181.3C1248,181,1344,203,1392,213.3L1440,224L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z">
        </path>
    </svg>
</div>
